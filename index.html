<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chineseimple – Integrated Chinese Tema 5</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<style>
:root {
  --bg-dark: #121212;
  --card-bg: #1e1e1e;
  --red-main: #ff3b30;
  --red-soft: rgba(255, 59, 48, 0.15);
  --border-color: #2c2c2e;
  --text-white: #ffffff;
  --text-muted: #a1a1a6;
  --blue-pinyin: #64d2ff;
  --green-ok: #30d158;
  --gold: #ffd60a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-white);
  min-height: 100vh;
  padding-bottom: 3rem;
  user-select: none;
}

/* TOPBAR RESPONSIVE CON NAVEGACIÓN A INICIO */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 20px) + 12px) 1.25rem 12px 1.25rem;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-title { 
  color: var(--red-main); 
  font-size: 18px; 
  font-weight: 800; 
  letter-spacing: -0.5px; 
  cursor: pointer;
}
.topbar-title:active { opacity: 0.7; }
.back-btn {
  background: var(--red-soft); color: var(--red-main); border: 1px solid var(--red-main);
  padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: none;
}

/* MENU GRID */
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 1.25rem; max-width: 500px; margin: 0 auto; }
.menu-card {
  background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px;
  padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
}
.menu-card:active { transform: scale(0.95); border-color: var(--red-main); }
.menu-icon { font-size: 42px; margin-bottom: 8px; color: var(--red-main); }
.menu-label { font-size: 15px; font-weight: 700; color: var(--red-main); }
.menu-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* SECTIONS */
.section { display: none; max-width: 500px; margin: 0 auto; padding: 1rem; }
.section.active { display: block; }

/* SWITCH DE DICCIONARIO Y FLASHCARDS */
.dict-switch-row, .speed-switch-row, .flash-switch-row {
  display: flex; gap: 8px; margin-bottom: 1rem; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color);
}
.switch-btn, .speed-btn, .flash-btn {
  flex: 1; padding: 10px 4px; border: none; border-radius: 8px; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; text-align: center;
}
.switch-btn.active, .speed-btn.active, .flash-btn.active { background: var(--red-main); color: #fff; }

/* FILTROS CATEGORIAS */
.cat-filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
.cat-chip {
  padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color);
  background: var(--card-bg); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.cat-chip.active { background: var(--red-main); color: #fff; border-color: var(--red-main); }

/* SEARCH BAR */
.search-input {
  width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color);
  background: var(--card-bg); color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
}
.search-input:focus { border-color: var(--red-main); }

/* FLASHCARDS */
.card-outer { perspective: 1000px; height: 280px; margin-bottom: 1rem; cursor: pointer; }
.card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s; }
.card-inner.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
  border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center;
}
.face.back { transform: rotateY(180deg); }
.hz-only { font-size: 72px; font-weight: bold; color: var(--red-main); line-height: 1.1; }
.py-text { font-size: 20px; color: var(--blue-pinyin); font-weight: 600; margin-top: 8px; }
.es-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }

.btn-row { display: flex; gap: 10px; margin-top: 1rem; }
.action-btn {
  flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color);
  background: var(--card-bg); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 8px;
}
.action-btn.yes { border-color: var(--green-ok); color: var(--green-ok); background: rgba(48, 209, 88, 0.15); }
.action-btn.no { border-color: var(--red-main); color: var(--red-main); background: var(--red-soft); }

/* DICCIONARIO ITEMS */
.dict-item {
  background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;
  padding: 12px 16px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s;
}
.dict-item:active { border-color: var(--red-main); }
.dict-header { display: flex; align-items: center; justify-content: space-between; }
.dict-num { font-size: 11px; color: var(--gold); font-weight: bold; margin-bottom: 2px; }
.dict-zh { font-size: 24px; font-weight: bold; color: var(--red-main); }
.dict-py { font-size: 13px; color: var(--blue-pinyin); }
.dict-es { font-size: 14px; color: #fff; text-align: right; font-weight: 500; }

.dict-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
.dict-detail.open { display: block; }
.gram-tag { font-size: 11px; color: var(--gold); background: rgba(255,214,10,0.1); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; display: inline-block; }
.gram-pos { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.gram-ex-box { background: rgba(0,0,0,0.3); border-left: 3px solid var(--red-main); padding: 8px; border-radius: 6px; margin-top: 6px; }

/* HISTORIAS Y GRAMATICA */
.story-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
.story-title { font-size: 16px; font-weight: bold; color: var(--red-main); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
.story-line { padding: 8px 0; border-bottom: 1px dashed var(--border-color); cursor: pointer; }
.story-zh { font-size: 18px; font-weight: 500; color: #fff; }
.story-py { font-size: 12px; color: var(--blue-pinyin); margin-top: 2px; }
.story-es { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* MODULO PRACTICA EXAMEN */
.practice-menu-card {
  background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
  padding: 1rem; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
}
.practice-menu-card:active { border-color: var(--red-main); }
.practice-title { font-size: 15px; font-weight: 700; color: #fff; }
.practice-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.practice-icon { font-size: 28px; margin-left: 10px; }
.audio-play-big {
  background: var(--red-soft); border: 1px solid var(--red-main); color: var(--red-main);
  padding: 16px; border-radius: 16px; font-size: 18px; font-weight: bold; text-align: center;
  cursor: pointer; margin-bottom: 16px;
}
.audio-play-big:active { transform: scale(0.98); }
.img-emoji-box { font-size: 64px; text-align: center; margin: 12px 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title" onclick="showMenu()">CHINESEIMPLE TEMA 5</div>
  <button class="back-btn" id="back-btn" onclick="showMenu()">← Volver</button>
</div>

<!-- MENÚ PRINCIPAL -->
<div class="menu-grid" id="main-menu
